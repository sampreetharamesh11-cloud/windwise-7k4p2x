services:
  backend:
    build:
      context: ./backend
    container_name: windwise-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: windwise-frontend
    ports:
      - "5175:80"
    depends_on:
      - backend
    restart: unless-stopped